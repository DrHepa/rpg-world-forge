name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu-py312-core:
    name: Ubuntu Python 3.12 core release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONUTF8: "1"
      WORLD_FORGE_RUNNER_IMAGE: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4 security backport
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-m5.lock
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Install audited toolchain and Forge
        run: |
          python -m pip install --requirement requirements-m5.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.13.0
      - name: Bind exact Linux Python for Studio subprocesses
        shell: bash
        run: |
          set -euo pipefail
          python_path="${pythonLocation}/bin/python"
          test -x "${python_path}"
          printf 'PYTHON=%s\nWORLD_FORGE_STUDIO_BUILD_PYTHON=%s\nWORLD_FORGE_STUDIO_TEST_PYTHON=%s\n' \
            "${python_path}" "${python_path}" "${python_path}" >> "${GITHUB_ENV}"
      - name: Install exact Studio dependencies
        working-directory: apps/studio
        run: npm ci
      - name: Run complete Studio verification
        working-directory: apps/studio
        run: npm run verify
      - name: Lint and formatting
        run: |
          python -m ruff check src tests scripts apps/studio/scripts/shell_package_snapshot.py
          python -m ruff format --check src tests scripts apps/studio/scripts/shell_package_snapshot.py
      - name: Compile Python
        run: python -m compileall -q src scripts tests apps/studio/scripts/shell_package_snapshot.py
      - name: Audit source contracts
        run: python -m worldforge audit-contracts --source-root .
      - name: Audit runtime AI boundary
        run: python -m worldforge audit-runtime src/isoworld
      - name: Validate foundation release profile
        run: python -m worldforge validate examples/foundation/source/manifest.json --profile release
      - name: Analyze neutral narrative fixture
        run: python -m worldforge analyze-narrative examples/foundation/source/manifest.json --fail-on warning
      - name: Audit phase skills
        run: python -m unittest tests.test_m4_game_scaffold.GameSkillLayoutTests -v
      - name: Verify neutral standalone and reproducible releases
        run: python -m scripts.verify_m5_release
      - name: Install Linux virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth
      - name: Exercise graphical raylib runtime under Xvfb
        run: xvfb-run -a python tests/raylib_smoke.py
      - name: Exercise bounded pyray GLB animation proof under Xvfb
        run: xvfb-run -a python tests/pyray_3d_native_smoke.py
      - name: Download, attest, and install the locked raylib wheel
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="${RUNNER_TEMP}/world-forge-runtime-wheel"
          mkdir -p "${wheelhouse}"
          python -m pip download --no-deps --only-binary=:all: --dest "${wheelhouse}" "cffi==1.17.1" "pycparser==2.23" "raylib==6.0.1.0"
          python -c 'import pathlib, sys; files=[path for path in sorted(pathlib.Path(sys.argv[1]).glob("*.whl")) if path.name.startswith("raylib-")]; assert len(files) == 1; print(files[0])' "${wheelhouse}" > "${RUNNER_TEMP}/world-forge-runtime-wheel-path.txt"
          runtime_wheel="$(cat "${RUNNER_TEMP}/world-forge-runtime-wheel-path.txt")"
          PYTHONPATH=src python -m scripts.verify_multigenre_release --report "${RUNNER_TEMP}/world-forge-raylib-attestation.json" --verify-runtime-wheel "${runtime_wheel}"
          python -m pip install --no-index --force-reinstall --find-links "${wheelhouse}" "cffi==1.17.1" "pycparser==2.23" "raylib==6.0.1.0"
          python -m pip check
      - name: Verify exact generic release lineage with native raylib
        id: native_release_verify
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/world-forge-multigenre-work"
          runtime_wheel="$(cat "${RUNNER_TEMP}/world-forge-runtime-wheel-path.txt")"
          xvfb-run -a python -m scripts.verify_multigenre_release --native required --runtime-wheel "${runtime_wheel}" --work-root "${work}"
      - name: Run bounded full unittest suite once
        run: |
          python - <<'PY'
          import concurrent.futures
          import subprocess
          import sys
          from pathlib import Path

          modules = [
              f"tests.{path.stem}"
              for path in sorted(Path("tests").glob("test_*.py"))
              if path.name != "__init__.py"
          ]
          if len(modules) != len(set(modules)):
              raise SystemExit("duplicate test module discovered")
          if not modules:
              raise SystemExit("no test modules discovered")

          def run_module(module: str) -> tuple[str, int]:
              return module, subprocess.run(
                  [sys.executable, "-m", "unittest", module, "-v"]
              ).returncode

          failures = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              for module, returncode in executor.map(run_module, modules):
                  if returncode != 0:
                      failures.append(module)
          if failures:
              print("failing modules:", *failures, sep="\n", file=sys.stderr)
              raise SystemExit(1)
          PY
      - name: Upload exact native evidence row
        if: always() && steps.native_release_verify.outcome == 'success' && steps.native_release_verify.outputs.release_row_published == 'true' && steps.native_release_verify.outputs.release_row_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: multigenre-release-Linux-py3.12
          path: ${{ steps.native_release_verify.outputs.release_row_path }}
          if-no-files-found: error
          retention-days: 90

  ubuntu-py311-compat-native:
    name: Ubuntu Python 3.11 compatibility native gates
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
