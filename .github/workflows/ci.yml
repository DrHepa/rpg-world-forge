      - name: Upload exact native evidence row
        if: always() && steps.native_release_verify.outcome == 'success' && steps.native_release_verify.outputs.release_row_published == 'true' && steps.native_release_verify.outputs.release_row_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: multigenre-release-Linux-py3.11
          path: ${{ steps.native_release_verify.outputs.release_row_path }}
          if-no-files-found: error
          retention-days: 90

  windows-py312-release:
    name: Windows Python 3.12 release gates
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONUTF8: "1"
      WORLD_FORGE_RUNNER_IMAGE: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4 security backport
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-m5.lock
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Install audited toolchains and Forge
        run: |
          python -m pip install --requirement requirements-m5.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.13.0
      - name: Bind exact Windows Python for Studio subprocesses
        shell: pwsh
        run: |
          $pythonPath = Join-Path $env:pythonLocation "python.exe"
          if (-not (Test-Path -LiteralPath $pythonPath -PathType Leaf)) {
            throw "setup-python did not expose the expected interpreter"
          }
          @(
            "PYTHON=$pythonPath"
            "WORLD_FORGE_STUDIO_BUILD_PYTHON=$pythonPath"
            "WORLD_FORGE_STUDIO_TEST_PYTHON=$pythonPath"
          ) |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Initialize strict external Windows native work root
        shell: pwsh
        run: |
          function Test-IsPathWithinOrEqual($Candidate, $Ancestor) {
            $candidateFull = [System.IO.Path]::GetFullPath($Candidate)
            $ancestorFull = [System.IO.Path]::GetFullPath($Ancestor)
            $relative = [System.IO.Path]::GetRelativePath($ancestorFull, $candidateFull)
            return $relative -eq "." -or (-not ([System.IO.Path]::IsPathRooted($relative)) -and -not ($relative.StartsWith(".." + [System.IO.Path]::DirectorySeparatorChar, [System.StringComparison]::Ordinal)) -and $relative -ne "..")
          }
          $repo = [System.IO.Path]::GetFullPath((Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path)
          $repoParent = [System.IO.Path]::GetDirectoryName($repo)
          $runnerTemp = [System.IO.Path]::GetFullPath((Resolve-Path -LiteralPath $env:RUNNER_TEMP).Path)
          $driveRoot = [System.IO.Path]::GetFullPath([System.IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE))
          $safeJob = $env:GITHUB_JOB -replace '[^A-Za-z0-9_.-]', '-'
          $name = "rwf-native-work-{0}-{1}-{2}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT, $safeJob
          $root = [System.IO.Path]::GetFullPath((Join-Path $driveRoot $name))
          if ($root -eq $driveRoot) {
            throw "strict Windows native work root resolved to filesystem root"
          }
          if (Test-IsPathWithinOrEqual $root $repo) {
            throw "strict Windows native work root resolved inside repository"
          }
          if (Test-IsPathWithinOrEqual $root $repoParent) {
            throw "strict Windows native work root resolved inside workspace parent"
          }
          if ((Test-IsPathWithinOrEqual $root $runnerTemp) -or (Test-IsPathWithinOrEqual $runnerTemp $root)) {
            throw "strict Windows native work root resolved in RUNNER_TEMP ancestry"
          }
          if (Test-Path -LiteralPath $root) {
            throw "strict Windows native work root already exists"
          }
          New-Item -ItemType Directory -Path $root | Out-Null
          "WORLD_FORGE_NATIVE_WORK_ROOT=$root" >> $env:GITHUB_ENV
      - name: Install exact Studio dependencies
        working-directory: apps/studio
        run: npm ci
      - name: Run complete Studio verification
        working-directory: apps/studio
        run: npm run verify
      - name: Run Windows fail-fast publication contract gate
        run: python -m unittest -v tests.test_bundle_publication.BundlePublicationTests.test_windows_seam_bundle_verifier_reads_with_seal_handles_active tests.test_m6_game_consumer.M6GameConsumerTests.test_stage_mkdir_failure_leaves_no_compositions_tree_and_retry_succeeds
      - name: Run native Windows world-project migration gate
        run: python tests/windows_native_world_project_migration.py
      - name: Exercise native Windows Python handle contracts without skips
        run: python tests/test_m6_release_readiness.py --run-windows-native-python
      - name: Exercise native Windows shell handle contract without skips
        shell: pwsh
        working-directory: apps/studio
        run: |
          $report = Join-Path $env:RUNNER_TEMP "rwf-windows-native-shell.json"
          node node_modules/vitest/vitest.mjs run `
            tests/main/shell-package-verifier.test.mjs `
            --testNamePattern "retains the native Windows package root against parent replacement" `
            --reporter=json "--outputFile=$report"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $env:WORLD_FORGE_STUDIO_BUILD_PYTHON `
            ../../tests/test_m6_release_readiness.py `
            --assert-vitest-passed $report `
            "retains the native Windows package root against parent replacement"
      - name: Build and reverify unpacked Windows shell
        shell: pwsh
        working-directory: apps/studio
        run: |
          $output = Join-Path $env:WORLD_FORGE_NATIVE_WORK_ROOT "rwf-studio-shell-win32-x64"
          if (Test-Path -LiteralPath $output) {
            throw "strict external package output already exists"
          }
          npm run package:dir -- --output $output --target win32-x64 | Tee-Object -Variable packageOutput
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $packageReport = @($packageOutput)[-1] | ConvertFrom-Json
          $unpacked = [string]$packageReport.package_path
          npm run package:verify -- --path $unpacked --target win32-x64
      - name: Exercise raylib CPU image encode and decode on Windows
        run: python tests/raylib_cpu_media_smoke.py
      - name: Verify pyray 3D ABI without claiming native graphics
        run: python tests/pyray_3d_abi_smoke.py
      - name: Download, attest, and install the locked raylib wheel
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="${RUNNER_TEMP}/world-forge-runtime-wheel"
          mkdir -p "${wheelhouse}"
          python -m pip download --no-deps --only-binary=:all: --dest "${wheelhouse}" "cffi==1.17.1" "pycparser==2.23" "raylib==6.0.1.0"
          python -c 'import pathlib, sys; files=[path for path in sorted(pathlib.Path(sys.argv[1]).glob("*.whl")) if path.name.startswith("raylib-")]; assert len(files) == 1; print(files[0])' "${wheelhouse}" > "${RUNNER_TEMP}/world-forge-runtime-wheel-path.txt"
          runtime_wheel="$(cat "${RUNNER_TEMP}/world-forge-runtime-wheel-path.txt")"
          PYTHONPATH=src python -m scripts.verify_multigenre_release --report "${RUNNER_TEMP}/world-forge-raylib-attestation.json" --verify-runtime-wheel "${runtime_wheel}"
          python -m pip install --no-index --force-reinstall --find-links "${wheelhouse}" "cffi==1.17.1" "pycparser==2.23" "raylib==6.0.1.0"
          python -m pip check
      - name: Verify exact generic release lineage with native raylib
        id: native_release_verify
        shell: bash
        run: |
          set -euo pipefail
          work="${WORLD_FORGE_NATIVE_WORK_ROOT}/world-forge-multigenre-work"
          runtime_wheel="$(cat "${RUNNER_TEMP}/world-forge-runtime-wheel-path.txt")"
          python -m scripts.verify_multigenre_release --native required --runtime-wheel "${runtime_wheel}" --work-root "${work}"
      - name: Upload exact native evidence row
        if: always() && steps.native_release_verify.outcome == 'success' && steps.native_release_verify.outputs.release_row_published == 'true' && steps.native_release_verify.outputs.release_row_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: multigenre-release-Windows-py3.12
          path: ${{ steps.native_release_verify.outputs.release_row_path }}
          if-no-files-found: error
          retention-days: 90
      - name: Cleanup strict external Windows native work root
        if: always()
        shell: pwsh
        run: |
          if ($env:WORLD_FORGE_NATIVE_WORK_ROOT) {
            function Test-IsPathWithinOrEqual($Candidate, $Ancestor) {
              $candidateFull = [System.IO.Path]::GetFullPath($Candidate)
              $ancestorFull = [System.IO.Path]::GetFullPath($Ancestor)
              $relative = [System.IO.Path]::GetRelativePath($ancestorFull, $candidateFull)
              return $relative -eq "." -or (-not ([System.IO.Path]::IsPathRooted($relative)) -and -not ($relative.StartsWith(".." + [System.IO.Path]::DirectorySeparatorChar, [System.StringComparison]::Ordinal)) -and $relative -ne "..")
            }
            $repo = [System.IO.Path]::GetFullPath((Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path)
            $repoParent = [System.IO.Path]::GetDirectoryName($repo)
            $runnerTemp = [System.IO.Path]::GetFullPath((Resolve-Path -LiteralPath $env:RUNNER_TEMP).Path)
            $driveRoot = [System.IO.Path]::GetFullPath([System.IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE))
            $root = [System.IO.Path]::GetFullPath($env:WORLD_FORGE_NATIVE_WORK_ROOT)
            if ($root -eq $driveRoot -or (Test-IsPathWithinOrEqual $root $repo) -or (Test-IsPathWithinOrEqual $root $repoParent) -or (Test-IsPathWithinOrEqual $root $runnerTemp) -or (Test-IsPathWithinOrEqual $runnerTemp $root)) {
              throw "refusing to cleanup unsafe Windows native work root"
            }
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }

